# Garbage-free async logging via LMAX Disruptor.
# Belt-and-suspenders with JVM arg in build.gradle.kts — this file ensures async
# logging is active even when launched outside Gradle (Docker, systemd, java -jar).
#
# Property names below are the canonical Log4j2 2.10+ form (log4j2.* prefix).
# See: https://logging.apache.org/log4j/2.x/manual/async.html#system-properties
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
log4j2.asyncLoggerRingBufferSize=262144
log4j2.asyncLoggerWaitStrategy=Yield
