# Seed account data — loaded at startup by ReferenceDataOrchestrator
# All quantities use fixed-point scale 10^-8 (PRICE_SCALE = 100_000_000)

accounts:
  - accountId: 1
    parentAccountId: 0
    accountCode: "ACME-001"
    acctIdSource: "Internal"
    accountName: "ACME Capital Management"
    accountType: "Client"
    baseCurrency: "USD"
    status: "Active"
    complianceStatus: "OK"
    capabilities: 3 # CAN_TRADE | CAN_RFQ
    # Phase 3 Commit B — per-account UI cohort + panel slot bindings
    # surfaced in WebSocketAuthAck (template 61). symbolPreferences ⊆
    # major-FX cohort matches pricing-service emitter; panelLayout pins
    # OrderEntryForm into right-top and Positions into left-bottom.
    symbolPreferences:
      - "EURUSD"
      - "GBPUSD"
      - "USDJPY"
    panelLayout:
      - panelId: "order-entry"
        slot: "right-top"
