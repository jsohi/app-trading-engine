accounts:
  - accountId: 1
    parentAccountId: 0
    accountCode: "ACME"
    acctIdSource: "Internal"
    accountName: "Acme Trading"
    accountType: "Client"
    baseCurrency: "USD"
    status: "Active"
    complianceStatus: "OK"
    capabilities: 3
    # Phase 3 Commit B: per-account UI cohort + panel-to-slot mapping
    # carried in WebSocketAuthAck (template 61). The worker subscribes to
    # the union of these symbols ∪ DEFAULT_SUBSCRIBE_SYMBOLS; App.tsx
    # mounts each panel into the requested slot, falling back to the
    # registry default when unset.
    symbolPreferences:
      - "EURUSD"
      - "GBPUSD"
      - "USDJPY"
    panelLayout:
      - panelId: "order-entry"
        slot: "right-top"
      - panelId: "positions"
        slot: "left-bottom"

  - accountId: 2
    parentAccountId: 0
    accountCode: "LOCKED"
    acctIdSource: "Internal"
    accountName: "Locked Account"
    accountType: "Client"
    baseCurrency: "USD"
    status: "Suspended"
    complianceStatus: "OK"
    capabilities: 1
