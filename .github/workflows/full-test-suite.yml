name: Full Test Suite

on:
  # Post-merge verification: when a PR lands on main, run the entire test
  # suite (unit + integration + e2e + alloc) unconditionally. The
  # workflow_dispatch `inputs.X` evaluate to empty/null under a `push`
  # event, so the per-job `if:` guards below also accept
  # `github.event_name == 'push'` to opt-everything-in for the
  # post-merge gate.
  push:
    branches: [main]
  # Manual on-demand trigger lets the operator pick which suite(s) to run
  # against a feature branch. Invoke from the GitHub Actions UI ("Run
  # workflow") or `gh workflow run full-test-suite.yml --ref <branch> -F …`.
  workflow_dispatch:
    inputs:
      unit-tests:
        description: "Unit tests + formatting + coverage"
        type: boolean
        default: true
      integration-tests:
        description: "Integration tests (JUnit)"
        type: boolean
        default: true
      e2e:
        description: "E2E — full 3-node cluster + FIX validation"
        type: boolean
        default: true
      alloc-regression:
        description: "No-allocation regression tests"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'push' || inputs.unit-tests }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and unit tests
        run: ./gradlew build jacocoTestReport -x :integration-tests:test

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco/"

  integration-test:
    if: ${{ github.event_name == 'push' || inputs.integration-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Integration tests
        run: ./gradlew :integration-tests:test

  e2e:
    if: ${{ github.event_name == 'push' || inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: E2E — boot 3-node cluster, FIX NOS, validate ExecutionReports
        run: ./gradlew e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs
          path: e2e/logs/

  alloc-regression:
    if: ${{ github.event_name == 'push' || inputs.alloc-regression }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: No-allocation regression tests
        continue-on-error: true
        run: |
          ./gradlew :gateway:test :orchestrator:test \
            --tests "*NoAllocationTest" \
            -DrunAllocTests=true
