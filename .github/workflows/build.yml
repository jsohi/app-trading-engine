name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and coverage
        run: ./gradlew build jacocoTestReport

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'

      # Allocation regression tripwires (gateway + orchestrator). Opt-in via
      # `-DrunAllocTests=true` because GC counts are inherently noisy on shared CI runners
      # (a stop-the-world from another tenant can advance the count and trip the assertion).
      # `continue-on-error: true` surfaces failures in the PR UI as warnings without blocking
      # the merge; sustained reds (3+ consecutive merges) should be investigated for a real
      # allocation regression. See:
      #   gateway/src/test/.../NoAllocationTest.java
      #   orchestrator/src/test/.../OrchestratorNoAllocationTest.java
      - name: No-allocation regression tests (opt-in)
        continue-on-error: true
        run: |
          ./gradlew :gateway:test :orchestrator:test \
            --tests "*NoAllocationTest" \
            -DrunAllocTests=true

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Cache NVD data
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}
          restore-keys: owasp-nvd-

      - name: OWASP dependency check
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owasp-report
          path: 'build/reports/dependency-check*'
