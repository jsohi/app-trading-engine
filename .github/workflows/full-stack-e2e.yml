name: Full-Stack E2E

# Plan §11. Heavy job — boots cluster + websocket-server + Vite + JWKS instances,
# runs Playwright full-stack suite + JCStress + stress JUnit phase. Skipped on fork
# PRs by default (mkcert + Aeron resource cost); maintainer can opt-in via
# workflow_dispatch with a reviewed head SHA.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Reviewed commit SHA to run against (REQUIRED for fork PRs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-stack-e2e:
    # Skip fork PRs unless maintainer-triggered via workflow_dispatch.
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (PR head)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout (workflow_dispatch — pinned SHA)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.head_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22

      - name: Install mkcert + nss
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools lsof

      - name: Resolve Playwright version
        # Read from package-lock.json directly — node_modules does not exist
        # yet at this step (the npm ci runs further down). The lockfile is the
        # single source of truth for the resolved Playwright version anyway.
        run: |
          echo "PLAYWRIGHT_VERSION=$(node -p "require('./web-ui/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('web-ui/package-lock.json') }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/**', 'gradle/libs.versions.toml') }}

      - name: npm install (web-ui workspace)
        # Required before `npm audit` — audit reads the installed tree, not just
        # package-lock.json. `npm ci` is the strict-CI variant: errors on any
        # lockfile drift.
        #
        # `--include-workspace-root` installs root devDependencies alongside the
        # web-ui workspace. This is required so the root `prepare` script (which
        # invokes `husky`) can find the `husky` binary — without root devDeps,
        # the bare `npm ci --workspace web-ui` form failed with exit 127 because
        # `sh: 1: husky: not found`. The prior `HUSKY=0` env-var fix did not work
        # because husky's "skip git-hooks install" semantics require the binary
        # to be present in the first place. Matches the local Gradle
        # `:web-ui:webUiInstall` task which runs `npm ci` from the root.
        #
        # HUSKY=0 is kept as belt-and-braces so even when husky IS installed it
        # is a no-op inside the CI runner — git hooks are a local-developer
        # ergonomics tool, never needed in CI.
        env:
          HUSKY: "0"
        run: npm ci --include-workspace-root --workspace web-ui

      - name: npm audit (high+)
        # Plan §11 — run audit before the heavy E2E so a known HIGH/CRITICAL fails fast.
        run: npm audit --workspaces --audit-level=high
        continue-on-error: false

      - name: SBE codec integrity check
        # Phase 3 §Commit 1 — verify the generated SBE codec output matches the checked-in
        # SHA-256 so a malicious commit cannot slip a tampered codec through. The `messages`
        # module generates codecs into `messages/build/generated/src/main/java/`; the checksum
        # file lives at `messages/generated-codec.sha256` (NOT under `build/` — that path is
        # gitignored). MUST fail the build on mismatch.
        run: |
          ./gradlew :messages:generateCodecs --no-daemon
          if [[ -f messages/generated-codec.sha256 ]]; then
            (cd messages/build/generated && sha256sum -c ../../generated-codec.sha256) || {
              echo "::error::SBE codec integrity check failed"; exit 1;
            }
          else
            echo "::error::no checked-in SHA file at messages/generated-codec.sha256"
            echo "generate via: (cd messages/build/generated && find src -type f -name '*.java' -print0 | sort -z | xargs -0 sha256sum > ../../generated-codec.sha256) and commit"
            exit 1
          fi

      - name: Run :fullStackE2e
        run: ./gradlew fullStackE2e --no-daemon

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: playwright-report-full-stack
          path: |
            web-ui/playwright-report-full-stack/
            web-ui/test-results/

      - name: Upload e2e logs (incl. JFR)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: e2e-logs
          path: e2e/logs/

      - name: Upload JCStress report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jcstress-report
          path: websocket-server/build/reports/jcstress/

      - name: Upload prod bundle
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: web-ui-dist
          path: web-ui/dist/
