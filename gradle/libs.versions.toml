[versions]
aeron = "1.50.4"
sbe = "1.37.1"
artio = "0.176"
agrona = "2.4.0"
junit = "6.0.3"
spotless = "7.2.1"
log4j2 = "2.25.4"
disruptor = "4.0.0"
gflog = "3.0.7"
owasp = "12.1.1"
snakeyaml = "2.6"
netty = "4.1.121.Final"
netty-tcnative = "2.0.69.Final"
micrometer = "1.14.5"
nimbus-jose-jwt = "10.3"
# Test-only — Jackson parses JSON output from chunk 13's roundtrip-driver.ts
# (see :sbe-typescript-generator:RoundTripTest). Not on any production hot path.
jackson = "2.20.0"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp = { id = "org.owasp.dependencycheck", version.ref = "owasp" }

[libraries]
aeron-cluster = { module = "io.aeron:aeron-cluster", version.ref = "aeron" }
aeron-driver = { module = "io.aeron:aeron-driver", version.ref = "aeron" }
aeron-client = { module = "io.aeron:aeron-client", version.ref = "aeron" }
aeron-archive = { module = "io.aeron:aeron-archive", version.ref = "aeron" }
# Reserved for integration-tests (Phase 3) and launcher tests (Phase 2) — APP-222
aeron-test-support = { module = "io.aeron:aeron-test-support", version.ref = "aeron" }
sbe-all = { module = "uk.co.real-logic:sbe-all", version.ref = "sbe" }
artio-core = { module = "uk.co.real-logic:artio-core", version.ref = "artio" }
artio-codecs = { module = "uk.co.real-logic:artio-codecs", version.ref = "artio" }
agrona = { module = "org.agrona:agrona", version.ref = "agrona" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j2" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j2" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
gflog-api = { module = "com.epam.deltix:gflog-api", version.ref = "gflog" }
gflog-core = { module = "com.epam.deltix:gflog-core", version.ref = "gflog" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-transport-native-kqueue = { module = "io.netty:netty-transport-native-kqueue", version.ref = "netty" }
netty-tcnative-boringssl = { module = "io.netty:netty-tcnative-boringssl-static", version.ref = "netty-tcnative" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
