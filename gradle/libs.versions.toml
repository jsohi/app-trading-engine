[versions]
aeron = "1.50.4"
sbe = "1.37.1"
artio = "0.176"
agrona = "2.4.0"
junit = "6.0.3"
spotless = "7.2.1"
log4j2 = "2.25.4"
disruptor = "4.0.0"
gflog = "3.0.7"
owasp = "12.1.1"
snakeyaml = "2.6"
netty = "4.1.121.Final"
netty-tcnative = "2.0.69.Final"
micrometer = "1.14.5"
nimbus-jose-jwt = "10.3"
# Test-only — Jackson parses JSON output from chunk 13's roundtrip-driver.ts
# (see :sbe-typescript-generator:RoundTripTest). Not on any production hot path.
jackson = "2.20.0"
# JMH micro-bench (APP-232) — :cluster:jmh task only, never bundled into the runtime.
jmh = "1.37"
jmh-gradle-plugin = "0.7.3"
# HdrHistogram for RfqLatencyRegressionIT P50/P99/P999 budget assertions.
hdr-histogram = "2.2.2"
# JCStress concurrency-stress harness for ReliableStreamTracker reconnect race coverage
# (plan §14). Pinned to the latest stable release. Test-only — :websocket-server:jcstress task.
jcstress = "0.16"
# Jetty 11 (test-scope only) for the Jetty stub server used by
# WebSocketServerConfigOidcDiscoveryTest. Pinned to 11.x because the
# jakarta.servlet Handler signature changed in Jetty 12 (split into ee10/ee11
# modules); production WebSocket server uses Netty, not Jetty. Centralised
# here so OWASP CVE scans cover it.
jetty11 = "11.0.24"
# jqwik property-based testing (Phase 3 Commit 1) — round-trip property tests on
# SBE templates 54/55/56/57. Test-only; never bundled into the runtime.
jqwik = "1.9.2"
# OpenTelemetry Java API — cold-path observability (APP-244 Phase 3 C.5).
# The `opentelemetry-api` artifact is allocation-free when the global tracer
# is the default no-op (i.e. when no SDK is installed / no OTLP endpoint set).
# Test scope brings in `opentelemetry-sdk-testing` for InMemorySpanExporter.
opentelemetry = "1.62.0"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp = { id = "org.owasp.dependencycheck", version.ref = "owasp" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-gradle-plugin" }

[libraries]
aeron-cluster = { module = "io.aeron:aeron-cluster", version.ref = "aeron" }
aeron-driver = { module = "io.aeron:aeron-driver", version.ref = "aeron" }
aeron-client = { module = "io.aeron:aeron-client", version.ref = "aeron" }
aeron-archive = { module = "io.aeron:aeron-archive", version.ref = "aeron" }
# Reserved for integration-tests (Phase 3) and launcher tests (Phase 2) — APP-222
aeron-test-support = { module = "io.aeron:aeron-test-support", version.ref = "aeron" }
sbe-all = { module = "uk.co.real-logic:sbe-all", version.ref = "sbe" }
artio-core = { module = "uk.co.real-logic:artio-core", version.ref = "artio" }
artio-codecs = { module = "uk.co.real-logic:artio-codecs", version.ref = "artio" }
agrona = { module = "org.agrona:agrona", version.ref = "agrona" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j2" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j2" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
gflog-api = { module = "com.epam.deltix:gflog-api", version.ref = "gflog" }
gflog-core = { module = "com.epam.deltix:gflog-core", version.ref = "gflog" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-transport-native-kqueue = { module = "io.netty:netty-transport-native-kqueue", version.ref = "netty" }
netty-tcnative-boringssl = { module = "io.netty:netty-tcnative-boringssl-static", version.ref = "netty-tcnative" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annotation-processor = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
hdr-histogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdr-histogram" }
jcstress-core = { module = "org.openjdk.jcstress:jcstress-core", version.ref = "jcstress" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty11" }
jetty-servlet = { module = "org.eclipse.jetty:jetty-servlet", version.ref = "jetty11" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
